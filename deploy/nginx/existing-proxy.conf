# Cấu hình gắn domain khi VPS ĐÃ CÓ reverse proxy giữ 80/443
# (nginx/openresty cũ, 1Panel, aaPanel, ...). MỘT domain cho cả UI và Registry:
#
#   https://hub.example.com/v2/*   → registry (docker login/push/pull)
#   https://hub.example.com/*      → Web UI
#
# Cách dùng:
#   - Nginx hệ thống: paste 2 location block dưới vào server block
#     (có SSL) của domain, reload nginx.
#   - 1Panel (openresty network host): tạo site hub.example.com + xin SSL
#     trong UI, rồi copy file này vào:
#       /opt/1panel/www/sites/hub.example.com/proxy/registry-ui.conf
#     (site 1Panel tự có dòng include /www/sites/<domain>/proxy/*.conf;)
#     rồi: docker exec openresty nginx -t && docker exec openresty nginx -s reload
#   - Khi đó KHÔNG chạy service nginx của stack (không cần --profile domain),
#     và .env khóa port về localhost.
#
# Upstream là port host của stack (xem deploy/.env: UI_PORT/REGISTRY_PORT).
# Nếu đổi port trong .env thì đổi tương ứng ở đây.

# Docker Registry API v2 — docker client push/pull.
# Layer lớn: không giới hạn, không buffer, stream thẳng.
location ^~ /v2/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# Web UI (frontend nginx bên trong stack tự proxy /api/ sang backend).
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
