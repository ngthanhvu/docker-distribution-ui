services:
  registry:
    image: registry:2.8.3
    container_name: registry-core
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    environment:
      REGISTRY_HTTP_RELATIVEURLS: "true"
    volumes:
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - registry-net

  backend:
    image: ${BACKEND_IMAGE:-${DOCKERHUB_USERNAME:-yourusername}/registry-ui-backend:${TAG:-latest}}
    container_name: registry-backend
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      REGISTRY_URL: http://registry:5000
      REGISTRY_PUBLIC_URL: ${REGISTRY_PUBLIC_URL:-http://localhost:5000}
      CACHE_TTL: ${CACHE_TTL:-30s}
      DATA_DIR: /data
      EVENT_SECRET: ${EVENT_SECRET:-dev-registry-events-secret}
      REGISTRY_STORAGE_DIR: /registry-data
      # Bật basic auth cho registry thì uncomment (khớp user/pass trong htpasswd)
      # REGISTRY_USERNAME: ${REGISTRY_USERNAME:-}
      # REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
    volumes:
      - backend-data:/data
      - registry-data:/registry-data:ro
    depends_on:
      registry:
        condition: service_healthy
    networks:
      - registry-net

  frontend:
    image: ${FRONTEND_IMAGE:-${DOCKERHUB_USERNAME:-yourusername}/registry-ui-frontend:${TAG:-latest}}
    container_name: registry-frontend
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - registry
    networks:
      - registry-net

  nginx:
    image: nginx:1.27-alpine
    container_name: registry-nginx
    restart: unless-stopped
    profiles: ["domain"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:-}
    volumes:
      - ./nginx/hub.conf.template:/etc/nginx/templates/hub.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - frontend
      - registry
    networks:
      - registry-net


volumes:
  registry-data:
  backend-data:
  letsencrypt:
  certbot-www:

networks:
  registry-net:
