services:
  registry:
    image: registry:2.8.3
    container_name: registry-core
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    environment:
      REGISTRY_HTTP_RELATIVEURLS: "true"
    volumes:
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      - registry-data:/var/lib/registry
      - token-keys:/token-keys:ro
    healthcheck:
      # 200 = open registry, 401 = token auth active — both healthy.
      test: ["CMD-SHELL", "wget -S -q -O /dev/null http://localhost:5000/v2/ 2>&1 | grep -q 'HTTP/1.1 200\\|HTTP/1.1 401'"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - registry-net

  backend:
    image: ${BACKEND_IMAGE:-${DOCKERHUB_USERNAME:-yourusername}/registry-ui-backend:${TAG:-latest}}
    container_name: registry-backend
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      REGISTRY_URL: http://registry:5000
      REGISTRY_PUBLIC_URL: ${REGISTRY_PUBLIC_URL:-http://localhost:5000}
      CACHE_TTL: ${CACHE_TTL:-30s}
      DATA_DIR: /data
      EVENT_SECRET: ${EVENT_SECRET:-dev-registry-events-secret}
      REGISTRY_STORAGE_DIR: /registry-data
      # Token auth (docker login via /api/token, same account as the web UI)
      TOKEN_AUTH: "true"
      TOKEN_KEY_DIR: /token-keys
    volumes:
      - backend-data:/data
      - registry-data:/registry-data:ro
      - token-keys:/token-keys
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/auth/status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    networks:
      - registry-net

  frontend:
    image: ${FRONTEND_IMAGE:-${DOCKERHUB_USERNAME:-yourusername}/registry-ui-frontend:${TAG:-latest}}
    container_name: registry-frontend
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - registry
    networks:
      - registry-net

  nginx:
    image: nginx:1.27-alpine
    container_name: registry-nginx
    restart: unless-stopped
    profiles: ["domain"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:-}
    volumes:
      - ./nginx/hub.conf.template:/etc/nginx/templates/hub.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - frontend
      - registry
    networks:
      - registry-net


volumes:
  registry-data:
  backend-data:
  token-keys:
  letsencrypt:
  certbot-www:

networks:
  registry-net:
