version: 0.1

log:
  level: info
  accesslog:
    disabled: true

storage:
  cache:
    blobdescriptor: inmemory
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true

http:
  addr: :5000
  relativeurls: true
  headers:
    X-Content-Type-Options: [nosniff]

notifications:
  endpoints:
    - name: registry-ui
      url: http://backend:8080/api/events
      timeout: 2s
      threshold: 3
      backoff: 1s
      headers:
        X-Registry-Event: [dev-registry-events-secret]

health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
