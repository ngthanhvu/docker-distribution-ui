version: 0.1

log:
  level: info
  accesslog:
    disabled: true

storage:
  cache:
    blobdescriptor: inmemory
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true

http:
  addr: :5000
  relativeurls: true
  headers:
    X-Content-Type-Options: [nosniff]

# Token auth: docker login/pull/push must request a bearer token from the UI
# backend (/api/token) using the web UI admin account. The realm must be
# reachable from docker clients (edit it to your public URL, e.g.
# https://registry.example.com/api/token).
auth:
  token:
    realm: http://localhost:8080/api/token
    service: registry-ui
    issuer: registry-ui
    rootcertbundle: /token-keys/token-root.pem

notifications:
  endpoints:
    - name: registry-ui
      url: http://backend:8080/api/events
      timeout: 2s
      threshold: 3
      backoff: 1s
      headers:
        X-Registry-Event: [dev-registry-events-secret]

health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
