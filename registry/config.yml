version: 0.1

log:
  level: info
  accesslog:
    disabled: true

storage:
  cache:
    blobdescriptor: inmemory
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true

http:
  addr: :5000
  relativeurls: true
  headers:
    X-Content-Type-Options: [nosniff]

# Push/pull/delete events are POSTed to the UI backend, which records
# them for the activity feed and last-pushed/last-pulled stats.
# If you change the secret here, also change EVENT_SECRET in docker-compose.yml.
notifications:
  endpoints:
    - name: registry-ui
      url: http://backend:8080/api/events
      timeout: 2s
      threshold: 3
      backoff: 1s
      headers:
        X-Registry-Event: [dev-registry-events-secret]

# Token auth: docker login/pull/push must request a bearer token from the UI
# backend (/api/token) using the web UI admin account. The realm must be
# reachable from docker clients (edit it when clients run on other machines,
# e.g. http://<host>:8081/api/token or https://<domain>/api/token). The
# issuer/service values must match TOKEN_ISSUER/TOKEN_SERVICE on the backend,
# and /token-keys is the shared signing-key volume.
auth:
  token:
    realm: http://localhost:8081/api/token
    service: registry-ui
    issuer: registry-ui
    rootcertbundle: /token-keys/token-root.pem

health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
