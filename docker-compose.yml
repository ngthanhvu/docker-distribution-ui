services:
  # Docker Distribution (official registry) — stores the images.
  registry:
    image: registry:2.8.3
    container_name: registry
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    volumes:
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      # - ./registry/auth:/etc/docker/registry/auth:ro
      - registry-data:/var/lib/registry
      - token-keys:/token-keys:ro
    healthcheck:
      # 200 = open registry, 401 = token auth active — both healthy.
      test: ["CMD-SHELL", "wget -S -q -O /dev/null http://localhost:5000/v2/ 2>&1 | grep -q 'HTTP/1.1 200\\|HTTP/1.1 401'"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - registry-net

  # Go backend — talks to the registry API v2 and serves JSON to the UI.
  backend:
    build: ./server
    container_name: registry-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      REGISTRY_URL: http://registry:5000
      REGISTRY_PUBLIC_URL: ${REGISTRY_PUBLIC_URL:-http://localhost:5000}
      CACHE_TTL: ${CACHE_TTL:-30s}
      DATA_DIR: /data
      EVENT_SECRET: ${EVENT_SECRET:-dev-registry-events-secret}
      REGISTRY_STORAGE_DIR: /registry-data
      # Token auth (docker login via /api/token, same account as the web UI).
      TOKEN_AUTH: "true"
      TOKEN_KEY_DIR: /token-keys
    volumes:
      - backend-data:/data
      - registry-data:/registry-data:ro
      - token-keys:/token-keys
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/auth/status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    networks:
      - registry-net

  # Frontend (Dev): Vite dev server with HMR on http://localhost:5173
  frontend:
    image: node:22-alpine
    container_name: registry-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      BACKEND_PROXY_TARGET: http://backend:8080
    ports:
      - "${UI_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - registry-net

volumes:
  registry-data:
  backend-data:
  token-keys:
  frontend-node-modules:

networks:
  registry-net:
